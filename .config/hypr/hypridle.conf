general {
    lock_cmd = pidof swaylock || swaylock -f
    before_sleep_cmd = pidof swaylock || swaylock -f
    after_sleep_cmd = niri msg output VGA-1 off; niri msg output VGA-1 on; sleep 1; niri msg output HDMI-A-1 off; niri msg output HDMI-A-1 on
}

listener {
    timeout = 120
    on-timeout = loginctl lock-session
}
